[project]
name = "NekoBuddy"
version = "0.3.0"
description = "A retro desktop companion, powered entirely by local LLMs."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Owen Braux" }
]
dependencies = [
    "PySide6>=6.6.0",
    "litellm>=1.20.0",
    "python-dotenv>=1.0.0",
    "pywinctl>=0.3.0",
    "ollama>=0.2.0"
]

[project.scripts]
nekobuddy = "src.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.ai", "src.config", "src.core", "src.ui"]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["Release_*", "dist", "build", ".venv", "_internal"]


